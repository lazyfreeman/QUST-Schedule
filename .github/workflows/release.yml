name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史和 tag，用于生成更新日志

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          APK_NAME="QUST-Schedule-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG_NAME}"
          else
            RANGE="${TAG_NAME}"
          fi
          git log "$RANGE" --no-merges --pretty=format:'%s' \
            | grep -v 'bump version' > /tmp/commits.txt || true

          echo "## 更新内容" > release_notes.md
          echo "" >> release_notes.md

          # 按提交类型分组：feat → 新功能，fix → 问题修复，其余 → 其他改进
          emit_section() {
            local title="$1" lines="$2"
            if [ -n "$lines" ]; then
              printf '### %s\n\n%s\n\n' "$title" "$lines" >> release_notes.md
            fi
          }
          strip_prefix() { sed -E 's/^[a-z]+(\([^)]*\))?!?:[[:space:]]*//; s/^/- /'; }

          FEATS=$(grep -E '^feat(\(|:|!)' /tmp/commits.txt | strip_prefix || true)
          FIXES=$(grep -E '^fix(\(|:|!)' /tmp/commits.txt | strip_prefix || true)
          OTHERS=$(grep -vE '^(feat|fix)(\(|:|!)' /tmp/commits.txt | strip_prefix || true)

          emit_section "新功能" "$FEATS"
          emit_section "问题修复" "$FIXES"
          emit_section "其他改进" "$OTHERS"

          if [ -n "$PREV_TAG" ]; then
            printf '[查看完整变更](https://github.com/%s/compare/%s...%s)\n' \
              "$GITHUB_REPOSITORY" "$PREV_TAG" "$TAG_NAME" >> release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.prepare_apk.outputs.apk_name }}
          name: QUST-Schedule ${{ steps.prepare_apk.outputs.tag_name }}
          draft: false
          prerelease: false
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_name }}
